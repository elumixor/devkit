<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Devkit Cloud</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Devkit Cloud</h1>
      <div class="controls">
        <span id="updated" class="muted"></span>
        <button id="refresh" title="Reload">↻</button>
        <span id="who" class="muted"></span>
        <button id="sign-out" hidden>Sign out</button>
      </div>
    </header>

    <section id="sign-in" class="sign-in" hidden>
      <div id="sign-in-widget"></div>
      <p class="muted">Signs in with your desk account (the same one as people.desk.atmagaming.com).</p>
    </section>

    <main hidden>
      <section id="projects" class="projects"></section>
      <section id="detail" class="detail" hidden>
        <div class="detail-head">
          <h2 id="detail-title"></h2>
          <nav>
            <button data-view="deploys" class="active">Deploys</button>
            <button data-view="logs">Logs</button>
          </nav>
          <button id="close" title="Close">×</button>
        </div>
        <div id="deploys-view"></div>
        <div id="logs-view" hidden>
          <div class="log-controls">
            <select id="since">
              <option value="15m">last 15 min</option>
              <option value="1h" selected>last hour</option>
              <option value="6h">last 6 h</option>
              <option value="1d">last day</option>
              <option value="3d">last 3 days</option>
            </select>
            <input id="grep" placeholder="filter, e.g. ERROR or ?timeout ?500" />
            <button id="load-logs">Load</button>
          </div>
          <pre id="logs"></pre>
        </div>
      </section>
    </main>

    <p id="message" class="message" hidden></p>
    <script src="/app.js"></script>
  </body>
</html>

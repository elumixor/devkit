name: deploy cloud apps

# The platform's own apps deploy to Devkit Cloud from CI with the OIDC role and no stored AWS keys,
# the same way every project will: the hello example that proves each feature. The dashboard lives in elumixor/desk-devkit.
on:
  push:
    branches: [main]
    paths: [examples/hello/**, src/**, .github/workflows/deploy-cloud.yml]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [examples/hello]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::453953529857:role/dk-deploy
          aws-region: eu-central-1
      - run: bun install --frozen-lockfile
      # The apps depend on this checkout's devkit, not the published one.
      - run: bun link
      - run: bun install --frozen-lockfile
        working-directory: ${{ matrix.app }}
      - run: bun run deploy
        working-directory: ${{ matrix.app }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
